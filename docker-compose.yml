version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: fstek_postgres
    environment:
      POSTGRES_DB: fstek_attestation
      POSTGRES_USER: fstek_admin
      POSTGRES_PASSWORD: strong_password_change_me
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fstek_admin"]
      interval: 10s
      retries: 5
  
  
  chromadb:
    image: chromadb/chroma:latest
    container_name: fstek_chromadb
    ports:
      - "8001:8000"
    volumes:
      - ./data/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fstek_redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
